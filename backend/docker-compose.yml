services:
  db:
    image: postgres:16
    container_name: questly-postgres
    environment:
      POSTGRES_DB: questly
      POSTGRES_USER: questly
      POSTGRES_PASSWORD: questly
    # Host 5433 avoids clashing with a local PostgreSQL already on 5432.
    ports:
      - "5433:5432"
    volumes:
      - questly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  questly_pgdata:
