openapi: 3.1.0
info:
  title: Questly API
  version: 0.1.0
  description: >
    Backend contract for Questly v3 (accounts & backend). This is the seam between the
    Android app and the Ktor + PostgreSQL service. The app keeps its existing
    CheckpointRepository / CheckInRepository interfaces and gains remote implementations
    that call these endpoints — the UI does not change.

    Auth: self-hosted email+password (with REAL email verification) plus Google OAuth.
    A newly registered account is INACTIVE until the user verifies a token emailed to
    the address, so throwaway/dummy emails cannot be used.

servers:
  - url: https://api.questly.example.com/v1
    description: Production (placeholder — host TBD)
  - url: http://10.0.2.2:8080/v1
    description: Local Ktor server as seen from the Android emulator

tags:
  - name: auth
    description: Registration, email verification, sign-in, sessions, account management
  - name: checkins
    description: Server-validated check-ins, history, and points
  - name: profile
    description: Streaks and achievements derived from the check-in ledger
  - name: friends
    description: Friend codes, requests, friendships, and the activity feed
  - name: devices
    description: FCM device-token registration for push notifications
  - name: events
    description: User-created events — hosting, discovery, and visibility (v5)
  - name: chat
    description: 1:1 and event group messaging, with block/mute/report moderation (v5)

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/register:
    post:
      tags: [auth]
      summary: Register with email + password
      description: >
        Creates an INACTIVE account and emails a verification token to the address.
        The account cannot sign in until POST /auth/verify-email succeeds. Returns 202
        even when the email already exists, to avoid leaking which emails are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Verification email sent (if the address was eligible)
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verify email ownership with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: One-time token from the verification email }
      responses:
        '200':
          description: Email verified; account is now active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: Token expired or already used

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Resend the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Verification email re-sent if the account exists and is unverified }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Email not yet verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/google:
    post:
      tags: [auth]
      summary: Sign in / sign up with a Google ID token
      description: The server verifies the Google ID token; the Google email is trusted as verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string, description: Google ID token from Google Sign-In on device }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair (refresh token is rotated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Refresh token revoked }

  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Request a password-reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Reset email sent if the account exists }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password using the emailed reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200': { description: Password changed; existing sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { description: Token expired or already used }

  /auth/me:
    get:
      tags: [auth]
      summary: Get the current user
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [auth]
      summary: Delete the current account and all its data
      description: Play Store requirement once accounts exist. Irreversible.
      responses:
        '204': { description: Account and associated data deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- devices
  /devices:
    post:
      tags: [devices]
      summary: Register this device's FCM token for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '204': { description: Registered }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{token}:
    delete:
      tags: [devices]
      summary: Unregister an FCM token (on sign-out)
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Unregistered }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # WebSocket (not expressible in OpenAPI): GET /v1/leaderboard — JWT-authenticated upgrade. On
  # connect the server sends a LeaderboardDto { entries: [{ userId, displayName, totalPoints, rank }] }
  # and pushes a fresh one on every check-in.

  # Checkpoint discovery is done on-device: the app queries Overpass directly (public Overpass
  # servers block the backend's datacenter IP), so there is no server-side /checkpoints endpoint.
  # The app supplies the checkpoint's location + category with each check-in instead.

  # -------------------------------------------------------------- checkins
  /checkins:
    get:
      tags: [checkins]
      summary: The user's check-in history (most recent first)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from a prior page }
      responses:
        '200':
          description: A page of check-ins
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [checkins]
      summary: Record a server-validated check-in
      description: >
        The server re-checks distance and time (anti-cheat) rather than trusting the client.
        Send an Idempotency-Key so a retry of the same attempt does not double-count.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInRequest' }
      responses:
        '201':
          description: Check-in accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckIn' }
        '409':
          description: Rejected by a check-in rule (too far, on cooldown, or unknown checkpoint)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInRejection' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /points:
    get:
      tags: [checkins]
      summary: The user's total points (server-owned ledger sum)
      responses:
        '200':
          description: Total points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Points' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- profile
  /profile:
    get:
      tags: [profile]
      summary: The user's gamification profile — streak, totals, and achievements
      responses:
        '200':
          description: Streak + totals and every achievement with progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- friends
  /friends:
    get:
      tags: [friends]
      summary: The user's friends (ranked by points) and incoming requests
      responses:
        '200':
          description: Friends + incoming requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendsPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /friends/code:
    get:
      tags: [friends]
      summary: The user's shareable friend code (allocated on first use)
      responses:
        '200':
          description: The friend code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /friends/requests:
    post:
      tags: [friends]
      summary: Send a friend request by code (auto-accepts if they already requested you)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        '201': { description: Request sent (or friendship created on mutual) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: NOT_FOUND / SELF / ALREADY_FRIENDS / ALREADY_REQUESTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /friends/requests/{id}/accept:
    post:
      tags: [friends]
      summary: Accept an incoming friend request
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /friends/requests/{id}/decline:
    post:
      tags: [friends]
      summary: Decline an incoming friend request
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Declined }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /friends/{userId}:
    delete:
      tags: [friends]
      summary: Remove a friend
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /feed:
    get:
      tags: [friends]
      summary: Activity feed — recent check-ins by the user and their friends
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ events (v5)
  /events:
    post:
      tags: [events]
      summary: Create an event (the caller becomes the host)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWriteRequest' }
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [events]
      summary: Discover published, upcoming events near a point
      description: >
        Returns events within radiusKm of (lat,lng), filtered to what the caller may see
        (PUBLIC to everyone, FRIENDS to the host's friends, PRIVATE to the host). Each item
        carries distanceMeters; results are nearest-first.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double } }
        - { name: radiusKm, in: query, schema: { type: number, format: double, default: 5 } }
        - { name: category, in: query, schema: { type: string, enum: [PARK, BEACH, VIEWPOINT, LANDMARK] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A page of nearby events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/mine:
    get:
      tags: [events]
      summary: Events the caller hosts (any status)
      responses:
        '200':
          description: The caller's hosted events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [events]
      summary: Get one event (visibility enforced)
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [events]
      summary: Replace an event (host only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWriteRequest' }
      responses:
        '200':
          description: The updated event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not the host, or the event is cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [events]
      summary: Cancel an event (host only)
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not the host
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events/{id}/register:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [events]
      summary: Register (RSVP) for a free event — waitlisted if full
      description: >
        Free events only. Returns REGISTERED, or WAITLISTED when at capacity. Idempotent for an
        already-active registration. NONE events (409 NO_REGISTRATION) and PAID events
        (409 PAYMENT_REQUIRED, deferred to Milestone G) are rejected.
      responses:
        '200':
          description: The caller's registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not open, self-hosted, or not a free event (HOST / NOT_OPEN / NO_REGISTRATION / PAYMENT_REQUIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [events]
      summary: Cancel your registration — auto-promotes the oldest waitlisted attendee
      responses:
        '204': { description: Unregistered }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/{id}/roster:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [events]
      summary: Attendee roster (host only)
      responses:
        '200':
          description: Registered / waitlisted / attended lists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roster' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not the host
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------ chat (v5)
  /conversations:
    get:
      tags: [chat]
      summary: The caller's conversations (DMs + event chats), newest activity first
      responses:
        '200':
          description: Inbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationsPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations/direct:
    post:
      tags: [chat]
      summary: Get-or-create a DM with a friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties: { userId: { type: string, format: uuid } }
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Not friends, self, or blocked (NOT_FRIENDS / SELF / BLOCKED)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /events/{id}/conversation:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [chat]
      summary: Get-or-create an event's group chat (host or registrant only)
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not a member (NOT_A_MEMBER)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /conversations/{id}/messages:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [chat]
      summary: Message history (newest first), paged by cursor
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagesPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Not a member
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    post:
      tags: [chat]
      summary: Send a message (also delivered live over the chat WebSocket)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, minLength: 1, maxLength: 2000 } }
      responses:
        '200':
          description: The created message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Not a member
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /conversations/{id}/read:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [chat]
      summary: Mark the conversation read (clears the unread count)
      responses:
        '204': { description: Marked read }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations/{id}/mute:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [chat]
      summary: Mute or unmute push notifications for the conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties: { muted: { type: boolean } }
      responses:
        '204': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{id}/block:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [chat]
      summary: Block a user (hide their messages, stop delivery)
      responses:
        '204': { description: Blocked }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [chat]
      summary: Unblock a user
      responses:
        '204': { description: Unblocked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/{id}/report:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [chat]
      summary: Report a message for moderation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string, maxLength: 500 } }
      responses:
        '204': { description: Reported }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from /auth/login, /auth/refresh, etc.

  responses:
    BadRequest:
      description: Malformed or invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (or not visible to the caller)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string, minLength: 1, maxLength: 40 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer, description: Lifetime of the access token }

    User:
      type: object
      required: [id, email, displayName, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }

    CheckInRequest:
      type: object
      required: [checkpointId, lat, lng, clientTimestamp, checkpointLat, checkpointLng, category, title]
      properties:
        checkpointId: { type: string }
        lat: { type: number, format: double, description: The user's current latitude. }
        lng: { type: number, format: double, description: The user's current longitude. }
        clientTimestamp: { type: string, format: date-time }
        checkpointLat: { type: number, format: double, description: The checkpoint's latitude (from the client's Overpass fetch). }
        checkpointLng: { type: number, format: double, description: The checkpoint's longitude. }
        category:
          type: string
          enum: [PARK, BEACH, VIEWPOINT, LANDMARK]
          description: Drives the server-computed point award; a client-sent point total is never trusted.
        title: { type: string }

    CheckIn:
      type: object
      required: [id, checkpointId, title, points, timestamp]
      properties:
        id: { type: string, format: uuid }
        checkpointId: { type: string }
        title: { type: string, description: Snapshotted at check-in time }
        points: { type: integer, description: Snapshotted at check-in time }
        timestamp: { type: string, format: date-time, description: Server-assigned time }

    CheckInPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CheckIn' }
        nextCursor:
          type: string
          description: Present when more results exist

    CheckInRejection:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [TOO_FAR, ON_COOLDOWN, UNKNOWN_CHECKPOINT, IMPLAUSIBLE]
        message: { type: string }
        retryAfterSeconds: { type: integer, description: For ON_COOLDOWN }

    Points:
      type: object
      required: [total]
      properties:
        total: { type: integer }

    Stats:
      type: object
      required: [currentStreakDays, longestStreakDays, totalCheckIns, totalPoints]
      properties:
        currentStreakDays: { type: integer }
        longestStreakDays: { type: integer }
        totalCheckIns: { type: integer }
        totalPoints: { type: integer }

    Achievement:
      type: object
      required: [id, title, description, target, value, earned]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        target: { type: integer, description: Metric value needed to earn it }
        value: { type: integer, description: Current progress, capped at target }
        earned: { type: boolean }

    Profile:
      type: object
      required: [stats, achievements]
      properties:
        stats: { $ref: '#/components/schemas/Stats' }
        achievements:
          type: array
          items: { $ref: '#/components/schemas/Achievement' }

    FriendCode:
      type: object
      required: [code]
      properties:
        code: { type: string, example: "QSTLY-7K2P9M" }

    Friend:
      type: object
      required: [userId, displayName, totalPoints]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        totalPoints: { type: integer }

    FriendRequest:
      type: object
      required: [id, requesterId, requesterDisplayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        requesterDisplayName: { type: string }
        createdAt: { type: string, format: date-time }

    FriendsPage:
      type: object
      required: [friends, incomingRequests]
      properties:
        friends:
          type: array
          items: { $ref: '#/components/schemas/Friend' }
        incomingRequests:
          type: array
          items: { $ref: '#/components/schemas/FriendRequest' }

    FeedItem:
      type: object
      required: [id, userId, displayName, title, points, timestamp]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        title: { type: string }
        points: { type: integer }
        timestamp: { type: string, format: date-time }

    FeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedItem' }
        nextCursor: { type: string, nullable: true }

    EventWriteRequest:
      type: object
      required: [title, category, lat, lng, startsAt]
      description: Full intended state of an event; used for both create (POST) and replace (PUT).
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, default: '' }
        category: { type: string, enum: [PARK, BEACH, VIEWPOINT, LANDMARK], description: Reuses checkpoint categories so events ride the check-in/points loop }
        venueName: { type: string, maxLength: 120, default: '' }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true, description: Must be after startsAt; null = open-ended }
        capacity: { type: integer, minimum: 1, nullable: true, description: null = unlimited }
        visibility: { type: string, enum: [PUBLIC, FRIENDS, PRIVATE], default: PUBLIC }
        registrationType: { type: string, enum: [NONE, FREE, PAID], default: NONE }
        priceCents: { type: integer, minimum: 1, nullable: true, description: Required iff registrationType=PAID }
        currency: { type: string, minLength: 3, maxLength: 3, nullable: true, description: ISO-4217; required iff registrationType=PAID }
        status: { type: string, enum: [DRAFT, PUBLISHED], default: PUBLISHED }

    Event:
      type: object
      required: [id, hostId, hostDisplayName, isHost, title, description, category, venueName, lat, lng, startsAt, visibility, registrationType, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        hostId: { type: string, format: uuid }
        hostDisplayName: { type: string }
        isHost: { type: boolean, description: True when the caller is the host }
        title: { type: string }
        description: { type: string }
        category: { type: string, enum: [PARK, BEACH, VIEWPOINT, LANDMARK] }
        venueName: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, nullable: true }
        visibility: { type: string, enum: [PUBLIC, FRIENDS, PRIVATE] }
        registrationType: { type: string, enum: [NONE, FREE, PAID] }
        priceCents: { type: integer, nullable: true }
        currency: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        distanceMeters: { type: number, format: double, nullable: true, description: Only set in area/discovery listings }
        registeredCount: { type: integer, description: Number of REGISTERED attendees }
        spotsLeft: { type: integer, nullable: true, description: capacity - registeredCount; null when unlimited }
        viewerStatus: { type: string, nullable: true, enum: [REGISTERED, WAITLISTED, CANCELLED, ATTENDED], description: The caller's own registration status, null if not registered }

    EventsPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }

    Registration:
      type: object
      required: [eventId, status]
      properties:
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [REGISTERED, WAITLISTED, CANCELLED, ATTENDED] }

    RosterEntry:
      type: object
      required: [userId, displayName, status, registeredAt]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        status: { type: string, enum: [REGISTERED, WAITLISTED, CANCELLED, ATTENDED] }
        registeredAt: { type: string, format: date-time }

    Roster:
      type: object
      required: [registered, waitlisted, attended]
      properties:
        registered: { type: array, items: { $ref: '#/components/schemas/RosterEntry' } }
        waitlisted: { type: array, items: { $ref: '#/components/schemas/RosterEntry' } }
        attended: { type: array, items: { $ref: '#/components/schemas/RosterEntry' } }

    Message:
      type: object
      required: [id, conversationId, senderId, senderDisplayName, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        senderDisplayName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    MessagesPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        nextCursor: { type: string, nullable: true }

    Conversation:
      type: object
      required: [id, type, title, unreadCount, muted]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DIRECT, EVENT] }
        title: { type: string, description: Other person's name (DIRECT) or event title (EVENT) }
        eventId: { type: string, format: uuid, nullable: true }
        otherUserId: { type: string, format: uuid, nullable: true, description: Set for DIRECT }
        lastMessage: { $ref: '#/components/schemas/Message' }
        unreadCount: { type: integer }
        muted: { type: boolean }

    ConversationsPage:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Stable, machine-readable error code }
        message: { type: string, description: Human-readable detail (no PII) }
